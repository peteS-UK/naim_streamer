test_ir:
  name: Test infrared signal
  description: Send a controlled Radio or Stop signal for diagnostic testing.
  fields:
    entity_id:
      name: Naim media player
      description: Select the Naim Streamer whose configured emitter will send the signal.
      required: true
      selector:
        entity:
          domain: media_player
          integration: naim_streamer
    button:
      name: Button
      required: true
      example: radio
      selector:
        select:
          options:
            - radio
            - stop
    waveform:
      name: Waveform
      description: Generated RC5, or reconstructed timings from the tester's learned signal.
      required: true
      example: generated
      selector:
        select:
          options:
            - generated
            - learned
    toggle:
      name: Toggle bit
      description: Generated waveform only. Learned signals use their recorded toggle.
      default: 0
      selector:
        number:
          min: 0
          max: 1
          step: 1
          mode: box
    frames:
      name: Frames
      description: Generated waveform only. The learned signals contain three frames.
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 1
          mode: box
    period_ms:
      name: Frame start-to-start interval
      description: Generated waveform only. The learned interval is approximately 110 ms.
      default: 114
      selector:
        number:
          min: 90
          max: 130
          step: 1
          mode: box
          unit_of_measurement: ms
